<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>TODO LIST</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<main>
    <h1 class="text-center mt-5 mb-5">TODO LIST</h1>
    <div class="container">
        <div class="row">
            <div class="col-4">
                <form id="todoForm">
                    <div class="mb-3">
                        <label class="form-label">Task title
                             <input type="text" name="title" class="form-control" />
                        </label>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Task body
                            <textarea name="description" class="form-control" placeholder="Task body" cols="30" rows="10"></textarea>
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary">Create Task!</button>
                    <button type="button" id="clearBtn" class="btn btn-secondary ms-2">Clear</button>
                    <button type="button" id="deleteAllBtn" class="btn btn-danger ms-2">Delete all</button>
                </form>
            </div>

            <div class="col-8">
                <div class="row" data-todo-items></div>
            </div>
        </div>
    </div>
</main>

<script src="./js/script.js"></script>
</body>
</html>
