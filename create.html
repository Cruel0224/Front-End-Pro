<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Створення товару</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h2>Створити товар</h2>
<form id="createForm">
  <div class="mb-3">
    <label class="form-label">Назва:
    <input type="text" class="form-control" id="titleName">
    </label>
  </div>
  <div class="mb-3">
    <label class="form-label">Опис:
    <textarea class="form-control" id="description"></textarea>
    </label>
  </div>
  <div class="mb-3">
    <label class="form-label" for="price">Ціна:
    <input type="number" step="0.01" min="0" class="form-control" id="price">
    </label>
  </div>
  <button type="submit" class="btn btn-primary">Створити</button>
</form>
<script src="js/create.js"></script>
</body>
</html>
